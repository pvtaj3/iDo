<svg xmlns="http://www.w3.org/2000/svg" id="iDo" width="1000" height="1000" viewBox="-0.5 -0.5 1 1">
  <defs>
    <!-- Outer Metallic Gradient to create the ring curvature -->
    <linearGradient id="outerMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4D4D4;" />
      <stop offset="25%" style="stop-color:#FFFFFF;" />
      <stop offset="50%" style="stop-color:#A0A0A0;" />
      <stop offset="75%" style="stop-color:#FFFFFF;" />
      <stop offset="100%" style="stop-color:#D4D4D4;" />
    </linearGradient>

    <!-- Soft Glow Effect -->
    <filter id="partnersGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.3" result="glow">
          <animate attributeName="stdDeviation" from="0.3" to="0.9" dur="3s" repeatCount="indefinite" begin="0s" />
      </feGaussianBlur>
    </filter>

    <!-- Inner Cutout Mask for a Hollow 3D Effect -->
    <mask id="ringMask">
      <!-- Full White Background (Visible Area) -->
      <rect x="-0.6" y="-0.6" width="1" height="1" fill="white"/>
      <!-- Black Inner Cutout (Transparent Area) -->
      <ellipse cx="0" cy="0" rx="0.27" ry="0.06" fill="black"/>
    </mask>

    <!-- Inner Shadow for Depth -->
    <radialGradient id="innerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000; stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000; stop-opacity:0" />
    </radialGradient>

    <!-- Utopian World Background -->
    <linearGradient id="utopianWorld" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#F5F3EB;" />
      <stop offset="100%" style="stop-color:#FFFFFF;" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="-0.5" y="-0.5" width="1" height="1" fill="url(#utopianWorld)" />

  <!-- Soft Glow Behind the Ring -->
  <ellipse cx="0" cy="0" rx="0.33" ry="0.11" fill="white" filter="url(#partnersGlow)" />

  <!-- Outer Metallic Band (Main Ring) with Mask for Cutout -->
  <ellipse cx="0" cy="0" rx="0.3" ry="0.11" fill="url(#outerMetal)" mask="url(#ringMask)" />
  <ellipse cx="0" cy="0.03" rx="0.06" ry="0.06" fill="url(#outerMetal)" mask="url(#ringMask)" />

  <!-- Inner Shadow to Enhance 3D Effect -->
  <ellipse cx="0" cy="-0.01" rx="0.33" ry="0.06" fill="url(#innerShadow)" opacity="0.6" />
</svg>